<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Peminjaman Gedung</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2563eb, #1e3a8a);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #1e3a8a;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #e5e7eb;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .login-form {
      display: none;
    }

    .login-form.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .info {
      margin-top: 20px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏫 Peminjaman Gedung</h1>
    <p class="subtitle">Silakan pilih jenis pengguna</p>

    <div class="tabs">
      <button class="tab active" onclick="showLogin('siswa')">
        👨‍🎓 Siswa
      </button>

      <button class="tab" onclick="showLogin('sekolah')">
        🏫 Sekolah
      </button>
    </div>

    <!-- LOGIN SISWA -->
    <form id="loginSiswa" class="login-form active" onsubmit="loginSiswa(event)">

      <h2>Login Siswa</h2>

      <label>Username</label>
      <input
        type="text"
        id="usernameSiswa"
        placeholder="Masukkan username"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="passwordSiswa"
        placeholder="Masukkan password"
        required
      >

      <button class="btn" type="submit">
        Login sebagai Siswa
      </button>

      <div class="info">
        <b>Demo:</b><br>
        Username: admin<br>
        Password: admin123
      </div>

    </form>

    <!-- LOGIN SEKOLAH -->
    <form id="loginSekolah" class="login-form" onsubmit="loginSekolah(event)">

      <h2>Login Pihak Sekolah</h2>

      <label>Username</label>
      <input
        type="text"
        id="usernameSekolah"
        placeholder="Masukkan username sekolah"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="passwordSekolah"
        placeholder="Masukkan password"
        required
      >

      <button class="btn" type="submit">
        Login sebagai Sekolah
      </button>

      <div class="info">
        <b>Demo:</b><br>
        Username: sekolah<br>
        Password: sekolah123
      </div>

    </form>

    <a class="back" href="index.html">
      ← Kembali ke Beranda
    </a>

  </div>

  <script>

    const AUTH_KEY = "peminjamanGedungLoggedIn";
    const ROLE_KEY = "peminjamanGedungRole";

    function showLogin(type) {

      const siswa = document.getElementById("loginSiswa");
      const sekolah = document.getElementById("loginSekolah");
      const tabs = document.querySelectorAll(".tab");

      if (type === "siswa") {

        siswa.classList.add("active");
        sekolah.classList.remove("active");

        tabs[0].classList.add("active");
        tabs[1].classList.remove("active");

      } else {

        siswa.classList.remove("active");
        sekolah.classList.add("active");

        tabs[0].classList.remove("active");
        tabs[1].classList.add("active");

      }
    }


    function loginSiswa(event) {

      event.preventDefault();

      const username =
        document.getElementById("usernameSiswa").value;

      const password =
        document.getElementById("passwordSiswa").value;

      if (username === "admin" && password === "admin123") {

        sessionStorage.setItem(AUTH_KEY, "true");
        sessionStorage.setItem(ROLE_KEY, "siswa");

        window.location.href = "dashboard.html";

      } else {

        alert("Username atau password siswa salah!");

      }
    }


    function loginSekolah(event) {

      event.preventDefault();

      const username =
        document.getElementById("usernameSekolah").value;

      const password =
        document.getElementById("passwordSekolah").value;

      if (username === "sekolah" && password === "sekolah123") {

        sessionStorage.setItem(AUTH_KEY, "true");
        sessionStorage.setItem(ROLE_KEY, "sekolah");

        window.location.href = "admin-dashboard.html";

      } else {

        alert("Username atau password sekolah salah!");

      }
    }

  </script>

</body>
</html>
