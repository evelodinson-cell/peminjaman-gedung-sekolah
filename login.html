<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Peminjaman Gedung</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f82;
        }

        .demo {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🏫 Login</h1>

    <p class="subtitle">
        Sistem Peminjaman Gedung Sekolah
    </p>

    <form onsubmit="login(event)">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="demo">
        Demo: admin / admin123
    </p>

    <a href="index.html" class="back">
        ← Kembali ke Beranda
    </a>

</div>

<script>

const AUTH_KEY = "peminjamanGedungLoggedIn";

function login(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (username === "admin" && password === "admin123") {

        sessionStorage.setItem(AUTH_KEY, "true");

        window.location.replace("dashboard.html");

    } else {

        alert("Username atau password salah!");

    }

}

</script>

</body>
</html>
