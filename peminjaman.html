<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Peminjaman</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #1769aa;
            color: white;
            padding: 20px;
        }

        .navbar {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logout {
            border: none;
            background: #d9534f;
            color: white;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .back {
            color: #1769aa;
            text-decoration: none;
        }

        .form-box {
            background: white;
            margin-top: 20px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        h1 {
            color: #1769aa;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #0d4f82;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="navbar">
        <div class="logo">🏫 Peminjaman Gedung Sekolah</div>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    </div>
</header>

<div class="container">

    <a href="dashboard.html" class="back">
        ← Kembali ke Dashboard
    </a>

    <div class="form-box">

        <h1>📝 Form Peminjaman</h1>

        <p>
            Isi data berikut untuk mengajukan peminjaman gedung.
        </p>

        <form onsubmit="ajukanPeminjaman(event)">

            <label for="nama">
                Nama Peminjam
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap"
                required
            >

            <label for="kontak">
                Nomor HP / Kontak
            </label>

            <input
                type="tel"
                id="kontak"
                placeholder="Contoh: 081234567890"
                required
            >

            <label for="gedung">
                Pilih Gedung
            </label>

            <select id="gedung" required>
                <option value="">-- Pilih Gedung --</option>
                <option value="Aula Sekolah">Aula Sekolah</option>
                <option value="Ruang Serbaguna">
                    Ruang Serbaguna
                </option>
                <option value="Lapangan Sekolah">
                    Lapangan Sekolah
                </option>
            </select>

            <label for="tanggal">
                Tanggal Peminjaman
            </label>

            <input
                type="date"
                id="tanggal"
                required
            >

            <label for="jamMulai">
                Jam Mulai
            </label>

            <input
                type="time"
                id="jamMulai"
                required
            >

            <label for="jamSelesai">
                Jam Selesai
            </label>

            <input
                type="time"
                id="jamSelesai"
                required
            >

            <label for="keperluan">
                Keperluan
            </label>

            <textarea
                id="keperluan"
                placeholder="Jelaskan keperluan peminjaman..."
                required
            ></textarea>

            <button type="submit">
                Kirim Pengajuan
            </button>

        </form>

    </div>

</div>

<script>

const AUTH_KEY = "peminjamanGedungLoggedIn";

if (sessionStorage.getItem(AUTH_KEY) !== "true") {
    window.location.replace("login.html");
}


// Isi gedung otomatis jika datang dari halaman Data Gedung

const params = new URLSearchParams(window.location.search);

const gedungDariUrl = params.get("gedung");

if (gedungDariUrl) {
    document.getElementById("gedung").value = gedungDariUrl;
}


// Set tanggal minimum hari ini

const today = new Date().toISOString().split("T")[0];

document.getElementById("tanggal").min = today;


// Submit peminjaman

function ajukanPeminjaman(event) {

    event.preventDefault();

    const data = {

        id: Date.now(),

        nama: document.getElementById("nama").value,

        kontak: document.getElementById("kontak").value,

        gedung: document.getElementById("gedung").value,

        tanggal: document.getElementById("tanggal").value,

        jamMulai: document.getElementById("jamMulai").value,

        jamSelesai: document.getElementById("jamSelesai").value,

        keperluan: document.getElementById("keperluan").value,

        status: "Menunggu Persetujuan"

    };


    let dataPeminjaman =
        JSON.parse(
            localStorage.getItem("dataPeminjaman")
        ) || [];


    dataPeminjaman.push(data);


    localStorage.setItem(
        "dataPeminjaman",
        JSON.stringify(dataPeminjaman)
    );


    alert(
        "Pengajuan berhasil dikirim!\n\n" +
        "Status: Menunggu Persetujuan"
    );


    window.location.href = "status.html";

}


function logout() {

    sessionStorage.removeItem(AUTH_KEY);

    window.location.replace("login.html");

}

</script>

</body>
</html>
